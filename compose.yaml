name: smm-agent

x-backend: &backend
  image: smm-agent-backend:local
  build: ./backend
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

x-database-url: &database-url "postgres://smm:${POSTGRES_PASSWORD:?Copy .env.example to .env}@db:5432/smm?sslmode=disable"

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: smm
      POSTGRES_USER: smm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "smm", "-d", "smm"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    <<: *backend
    command: ["/app/api"]
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: "0.0.0.0:8180"
      LLM_FILTERS_URL: ${LLM_FILTERS_URL:-}
      LLM_FILTERS_MODEL: ${LLM_FILTERS_MODEL:-}
      LLM_FILTERS_API_KEY: ${LLM_FILTERS_API_KEY:-}
    ports:
      - "127.0.0.1:${SMM_API_PORT:-8180}:8180"

  worker:
    <<: *backend
    command: ["/app/worker"]
    environment:
      DATABASE_URL: *database-url
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-2m}
      WORKER_TICK_INTERVAL: ${WORKER_TICK_INTERVAL:-5s}

  integration:
    profiles: ["test"]
    build:
      context: ./backend
      target: build
    image: smm-agent-backend-test:local
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "test", "-count=1", "-v", "./..."]
    environment:
      SMM_TEST_DATABASE_URL: *database-url

volumes:
  pgdata:
