services:
  llm:
    gpus: all
    tmpfs:
      - /runtime-links
    entrypoint:
      - /bin/sh
      - -ec
      - |
        ulimit -c 0
        server=/models/cuda-b12208/server/llama-b12208
        cuda=/models/cuda-b12208/libraries/cudart-llama-b12208-bin-ubuntu-cuda-12.8-x64
        for lib in "$$server"/lib*.so.0.*; do
          name=$${lib##*/}
          ln -sf "$$lib" "/runtime-links/$${name%%.so.*}.so.0"
        done
        export LD_LIBRARY_PATH="/runtime-links:$$server:$$cuda"
        cd "$$server"
        exec ./llama-server --n-gpu-layers 99 "$$@"
      - --
    command: ["--model", "/models/qwen3-4b-instruct-q4_k_m.gguf", "--alias", "qwen3-4b-instruct", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "8192", "--parallel", "2", "--threads", "6"]
